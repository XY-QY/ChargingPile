<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 充电桩管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <h2>⚡ 充电桩管理系统</h2>
        <p class="sub">郑州大学 · 柳园 / 荷园 / 菊园 / 松园</p>
        <div class="field">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary" onclick="doLogin()">登 录</button>
        <div class="switch">还没有账号？<a href="/register.html">立即注册</a></div>
        <div class="switch" style="margin-top:8px;font-size:12px;color:#aaa;">测试账号：admin / admin123（管理员） · user1 / 123456（用户）</div>
    </div>
</div>
<script src="/js/common.js"></script>
<script>
async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showToast('请输入用户名和密码'); return; }
    const r = await API.post('/api/auth/login', { username, password });
    if (r.code === 0) {
        showToast('登录成功');
        setTimeout(() => location.href = '/index.html', 500);
    } else {
        showToast(r.message);
    }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
